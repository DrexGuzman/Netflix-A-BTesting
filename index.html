<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Películas y series ilimitadas y mucho más.">
    <title>Netflix Costa Rica</title>
    <link rel="stylesheet" href="./css/index.css">
    <style>
        html:not([data-gb-ready]) #experiment-content {
            visibility: hidden;
        }
    </style>
    <noscript>
        <style>
            html:not([data-gb-ready]) #experiment-content {
                visibility: visible;
            }
        </style>
    </noscript>
    <script>
        window.setTimeout(function () {
            if (document.documentElement.hasAttribute("data-gb-ready")) {
                return;
            }
            var content = document.querySelector("#experiment-content");
            var fallback = document.querySelector("#variant-a");
            if (content && fallback && !content.querySelector(":scope > section.hero")) {
                content.appendChild(fallback.content.cloneNode(true));
            }
            document.documentElement.setAttribute("data-gb-ready", "");
        }, 3000);
    </script>
    <script type="module" src="./js/growthbook.js"></script>
</head>

<body data-gb-page="landing">
    <header class="site-header">
        <a class="brand" href="./index.html" aria-label="Netflix">
            <img src="./source/netflixLogo.svg" alt="Netflix">
        </a>
        <nav class="header-actions" aria-label="Navegación principal">
            <label class="language-picker" for="language">
                <span class="sr-only">Selecciona el idioma</span>
                <select id="language" name="language">
                    <option value="es-CR">Español</option>
                    <option value="en-CR">English</option>
                </select>
            </label>
            <a class="button button-small" href="./login.html"
                data-gb-event="login_click" data-gb-location="header">Iniciar sesión</a>
        </nav>
    </header>

    <main id="experiment-content" aria-live="polite">
        <noscript>
            <section class="hero">
                <div class="hero-background" aria-hidden="true"></div>
                <div class="hero-content">
                    <h1>Películas y series ilimitadas y mucho más</h1>
                    <p class="hero-subtitle">Activa JavaScript para completar tu suscripción.</p>
                </div>
            </section>
        </noscript>
    </main>

    <template id="variant-a">
        <section class="hero">
            <div class="hero-background" aria-hidden="true"></div>
            <div class="hero-content">
                <h1>Películas y series ilimitadas y mucho más</h1>
                <p class="hero-subtitle">A partir de USD&nbsp;9,99. Cancela cuando quieras.</p>
                <form class="signup-form" action="./confirmarCorreo.html" method="get"
                    data-gb-event="email_submit" data-gb-location="hero">
                    <h2>¿Quieres ver Netflix ya? Ingresa tu email para crear una cuenta o reiniciar tu membresía de
                        Netflix.</h2>
                    <div class="form-row">
                        <label class="sr-only" for="email-a">Email</label>
                        <input id="email-a" type="email" autocomplete="email" placeholder="Email"
                            required>
                        <button class="button button-large" type="submit">Comenzar <span aria-hidden="true">›</span></button>
                    </div>
                </form>
            </div>
        </section>
        <section class="feature feature-dark">
            <div class="feature-content">
                <h2>Disfruta en tu TV</h2>
                <p>Ve en smart TV, PlayStation, Xbox, Chromecast, Apple TV, reproductores de Blu-ray y más.</p>
            </div>
            <div class="device-art tv-art" aria-hidden="true">
                <div class="screen"></div>
                <div class="stand"></div>
            </div>
        </section>
        <section class="feature feature-dark feature-reverse">
            <div class="feature-content">
                <h2>Descarga tus series para verlas offline</h2>
                <p>Guarda tus títulos favoritos y disfruta Netflix donde quieras.</p>
            </div>
            <div class="device-art phone-art" aria-hidden="true">
                <div class="phone-screen">
                    <span class="download-icon">↓</span>
                    <strong>Descargando...</strong>
                </div>
            </div>
        </section>
        <section class="feature feature-dark">
            <div class="feature-content">
                <h2>Disfruta donde quieras</h2>
                <p>Películas y series ilimitadas en tu teléfono, tablet, laptop y TV.</p>
            </div>
            <div class="device-art devices-art" aria-hidden="true">
                <div class="laptop-screen"></div>
                <div class="tablet-screen"></div>
            </div>
        </section>
        <section class="feature feature-dark feature-reverse">
            <div class="feature-content">
                <h2>Crea perfiles para niños</h2>
                <p>Los niños disfrutarán de aventuras con sus personajes favoritos en un espacio creado especialmente
                    para ellos, sin costo adicional.</p>
            </div>
            <div class="kids-art" aria-hidden="true">KIDS</div>
        </section>
        <section class="faq feature-dark">
            <h2>Preguntas frecuentes</h2>
            <div class="faq-list">
                <details><summary>¿Qué es Netflix?</summary><p>Netflix es un servicio de streaming que ofrece una gran variedad de películas, series y documentales.</p></details>
                <details><summary>¿Cuánto cuesta Netflix?</summary><p>Disfruta Netflix en tu teléfono, tablet, Smart TV, laptop o dispositivo de streaming por una tarifa mensual fija.</p></details>
                <details><summary>¿Dónde puedo ver Netflix?</summary><p>Ve Netflix en cualquier dispositivo conectado a internet que tenga la aplicación de Netflix, como smart TV, teléfonos, tablets y computadoras.</p></details>
                <details><summary>¿Cómo cancelo?</summary><p>Puedes cancelar tu membresía en cualquier momento desde la sección de cuenta.</p></details>
                <details><summary>¿Qué puedo ver en Netflix?</summary><p>Netflix ofrece películas, series, documentales y contenido original para toda la familia.</p></details>
            </div>
            <form class="signup-form faq-signup" action="./confirmarCorreo.html" method="get"
                data-gb-event="email_submit" data-gb-location="faq">
                <h3>¿Quieres ver Netflix ya? Ingresa tu email para crear una cuenta o reiniciar tu membresía.</h3>
                <div class="form-row">
                    <label class="sr-only" for="faq-email-a">Email</label>
                    <input id="faq-email-a" type="email" autocomplete="email" placeholder="Email" required>
                    <button class="button button-large" type="submit">Comenzar <span aria-hidden="true">›</span></button>
                </div>
            </form>
        </section>
    </template>

                        <tr><th scope="row">Dispositivos del hogar a la vez</th><td>1</td><td>2</td><td>4</td></tr>
                        <tr><th scope="row">Descargas en dispositivos</th><td>1</td><td>2</td><td>6</td></tr>
                    </tbody>
                </table>
            </div>
            <p class="comparison-note">La disponibilidad de HD, Full HD, Ultra HD (4K) y HDR depende de tu servicio de internet y del dispositivo. El contenido puede variar según el plan.</p>

        <section class="feature feature-dark">
            <div class="feature-content"><h2>Disfruta en tu TV</h2><p>Ve en smart TV, PlayStation, Xbox, Chromecast, Apple TV, reproductores de Blu-ray y más.</p></div>
            <div class="device-art tv-art" aria-hidden="true"><div class="screen"></div><div class="stand"></div></div>
